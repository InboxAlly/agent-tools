name: Dependency review
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    # Dependency review reads the dependency graph, which public repositories have; a private
    # fork without GitHub Advanced Security skips it.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
