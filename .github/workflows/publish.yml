name: Publish CLI
on:
  release:
    types: [published]

permissions:
  contents: read

# Publishes @inboxally/cli to npm through trusted publishing (OIDC), with provenance. The
# `npm` environment requires a maintainer's approval, and the release tag must name the package
# version, so a release can only publish what it says.
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Release tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "${GITHUB_REF_NAME}" = "cli-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not name cli-v${version}"; exit 1; }
      - name: npm is new enough for trusted publishing
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm "+process.argv[1]+" is older than 11.5.1, which trusted publishing needs"); process.exit(1); }' "$(npm --version)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      # Trusted publishing needs the package to exist, so the very first publish uses a token
      # stored as the `npm` environment's NPM_TOKEN secret. Once trusted publishing is configured,
      # the secret is deleted and the token revoked; with no secret, npm uses trusted publishing.
      - run: npm publish --workspace @inboxally/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
